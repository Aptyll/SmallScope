<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- what the page may load: its own files and blobs (bot workers), plus
     ws/wss to a multiplayer relay. No script, font or fetch from another
     host, so a bot worker (which inherits this) cannot reach out -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' file: blob: 'unsafe-inline' 'unsafe-eval'; worker-src 'self' file: blob:; font-src 'self' file: data:; connect-src 'self' file: data: blob: ws: wss:">
<title>Softfall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; /* pillarbox bars on wider-than-16:9 screens */
    overflow: hidden;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #game { position: relative; z-index: 1; background: #0d1524; -webkit-user-select: none; user-select: none; }
  /* the replay window's frame, at device resolution over the game canvas's
     bottom-left corner: the game canvas has too few pixels there to hold it */
  #replay { position: fixed; z-index: 2; display: none; pointer-events: none; }
  /* decorative frost frame behind the game; visible only as pillarbox bars */
  #bars { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bars"></canvas>
<canvas id="game" width="640" height="360"></canvas>
<canvas id="replay"></canvas>
<!-- every script is `defer`: still run in this order, after the page is parsed.
     The CSP <meta> above turns off Chrome's look-ahead fetch, so without defer
     each file waited for the one before it to download and run (one round
     trip per file on the web build). app/check-globals.js fails a script without it. -->
<!-- the local player profile (name, stats, settings) and the only file that touches
     localStorage: it has no dependencies, so it goes first. -->
<script defer src="js/profile.js"></script>
<script defer src="js/font.js"></script>
<!-- js/sprites/: every sprite as a char grid + palette, baked at load. core.js first (it
     makes SPRITES and the SPR helpers); each file after it registers the keys it owns. -->
<script defer src="js/sprites/core.js"></script>
<script defer src="js/sprites/characters.js"></script>
<script defer src="js/sprites/looks.js"></script>
<script defer src="js/sprites/robot.js"></script>
<script defer src="js/sprites/terrain.js"></script>
<script defer src="js/sprites/rocks.js"></script>
<script defer src="js/sprites/beasts.js"></script>
<script defer src="js/sprites/bears.js"></script>
<script defer src="js/sprites/snowdrops.js"></script>
<script defer src="js/sprites/eagle.js"></script>
<script defer src="js/sprites/warbirds.js"></script>
<script defer src="js/sprites/buildings.js"></script>
<script defer src="js/sprites/items.js"></script>
<script defer src="js/sprites/icons.js"></script>
<script defer src="js/sprites/landmarks.js"></script>
<!-- audio/sfx/*.mp3 baked to base64 by app/bake-sfx.js: a file:// page cannot fetch
     its own folder, so this is what lets the sound effects work when index.html
     is opened straight off the disk. Must load before audio.js. -->
<script defer src="js/sfxdata.js"></script>
<script defer src="js/audio.js"></script>
<!-- docs/media/logos/mainMenuSoftfall.png keyed and baked by app/bake-logo.js
     for the same reason: an <img> off a file:// path would taint the canvas. -->
<script defer src="js/logodata.js"></script>
<script defer src="js/notesart.js"></script>
<!-- The game code: flat classic scripts sharing one global scope
     (docs/dev/architecture.md). A file may reference names from any file at runtime, but its
     top-level (load-time) statements may only reference names from files loaded above it. -->
<script defer src="js/core.js"></script>
<script defer src="js/canvas.js"></script>
<script defer src="js/player.js"></script>
<script defer src="js/input.js"></script>
<!-- the other controller, a keyboard-and-mouse in disguise: it calls
     input.js's keyPress/pointerPress and folds its sticks into sampleHumanInput -->
<script defer src="js/gamepad.js"></script>
<script defer src="js/world.js"></script>
<script defer src="js/depth.js"></script>
<script defer src="js/landmarks.js"></script>
<script defer src="js/nav.js"></script>
<script defer src="js/wildlife.js"></script>
<script defer src="js/structures.js"></script>
<script defer src="js/robots.js"></script>
<script defer src="js/actions.js"></script>
<script defer src="js/tools.js"></script>
<script defer src="js/mining.js"></script>
<script defer src="js/tunnel.js"></script>
<script defer src="js/abilities.js"></script>
<script defer src="js/ai-skill.js"></script>
<script defer src="js/ai.js"></script>
<script defer src="js/ai-team.js"></script>
<script defer src="js/bots/api.js"></script>
<script defer src="js/bots/lib.js"></script>
<script defer src="js/sim.js"></script>
<script defer src="js/shed.js"></script>
<script defer src="js/ai-callouts.js"></script>
<!-- js/net/: what a match shares between screens. events.js records the step's cosmetics
     (a puff, a number, a cue, a shake) for a host's clients; solo records nothing. -->
<script defer src="js/net/events.js"></script>
<script defer src="js/net/net.js"></script>
<script defer src="js/net/snapshot.js"></script>
<script defer src="js/net/transport-ws.js"></script>
<script defer src="js/net/transport-steam.js"></script>
<!-- js/draw/: the world's pixels, cut from the one draw-world.js. ground.js first (every
     other draw file calls its hash2); render.js composes the frame and comes last. -->
<script defer src="js/draw/depth.js"></script>
<script defer src="js/draw/ground.js"></script>
<script defer src="js/draw/landmarks.js"></script>
<script defer src="js/draw/lakes.js"></script>
<script defer src="js/draw/trample.js"></script>
<script defer src="js/draw/practice.js"></script>
<script defer src="js/draw/zipline.js"></script>
<script defer src="js/draw/tunnel.js"></script>
<script defer src="js/draw/overhead.js"></script>
<script defer src="js/draw/structs.js"></script>
<script defer src="js/draw/bodies.js"></script>
<script defer src="js/draw/marks.js"></script>
<script defer src="js/draw/callouts.js"></script>
<script defer src="js/draw/light.js"></script>
<script defer src="js/draw/render.js"></script>
<!-- js/ui/: the in-match HUD, cut from the one ui.js, in this order - four of its
     load-time constants read an earlier file's (AB_CELL, SHELF_X, CORNER_CLAIM, RAIL_PAD);
     then the screens: the shop, the panels, the menu and the end screens. -->
<script defer src="js/ui/wheel.js"></script>
<script defer src="js/ui/minimap.js"></script>
<script defer src="js/ui/bag.js"></script>
<script defer src="js/ui/strip.js"></script>
<script defer src="js/ui/hud-draw.js"></script>
<script defer src="js/ui/rail.js"></script>
<script defer src="js/ui/tooltip.js"></script>
<script defer src="js/ui/compose.js"></script>
<script defer src="js/ui/shop.js"></script>
<script defer src="js/ui/forge.js"></script>
<script defer src="js/ui/panels.js"></script>
<script defer src="js/ui/menu.js"></script>
<script defer src="js/ui/chars.js"></script>
<script defer src="js/ui/skins.js"></script>
<script defer src="js/ui/story.js"></script>
<script defer src="js/ui/ladder.js"></script>
<script defer src="js/ui/screens.js"></script>
<script defer src="js/ui/lobby.js"></script>
<script defer src="js/save.js"></script>
<script defer src="js/ui/saves.js"></script>
<script defer src="js/ui/botview.js"></script>
<script defer src="js/boot.js"></script>
</body>
</html>
