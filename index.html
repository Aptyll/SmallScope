<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Softfall</title>
<!-- viewport-fit=cover: a phone's notch and home bar are inside the window, so
     the canvas reaches the glass edge to edge; user-scalable=no: a double-tap must
     never zoom the page (js/touch.js owns every finger) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; /* pillarbox bars on wider-than-16:9 screens */
    overflow: hidden;
    overscroll-behavior: none; /* no pull-to-refresh or rubber-band under a stick */
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* touch-action none: the browser gets no pan, pinch or double-tap zoom out of
     a finger on the game - every touch is a pointer event js/touch.js reads */
  #game { position: relative; z-index: 1; background: #0d1524; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* the replay window's frame, at device resolution over the game canvas's
     bottom-left corner: the game canvas has too few pixels there to hold it */
  #replay { position: fixed; z-index: 2; display: none; pointer-events: none; }
  /* decorative frost frame behind the game; visible only as pillarbox bars */
  #bars { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bars"></canvas>
<canvas id="game" width="640" height="360"></canvas>
<canvas id="replay"></canvas>
<!-- the local player profile (name, stats, settings) and the only file that touches
     localStorage: it has no dependencies, so it goes first. -->
<script src="js/profile.js"></script>
<script src="js/font.js"></script>
<!-- js/sprites/: every sprite as a char grid + palette, baked at load. core.js first (it
     makes SPRITES and the SPR helpers); each file after it registers the keys it owns. -->
<script src="js/sprites/core.js"></script>
<script src="js/sprites/characters.js"></script>
<script src="js/sprites/looks.js"></script>
<script src="js/sprites/terrain.js"></script>
<script src="js/sprites/beasts.js"></script>
<script src="js/sprites/eagle.js"></script>
<script src="js/sprites/buildings.js"></script>
<script src="js/sprites/items.js"></script>
<script src="js/sprites/icons.js"></script>
<!-- audio/sfx/*.mp3 baked to base64 by app/bake-sfx.js: a file:// page cannot fetch
     its own folder, so this is what lets the sound effects work when index.html
     is opened straight off the disk. Must load before audio.js. -->
<script src="js/sfxdata.js"></script>
<script src="js/audio.js"></script>
<!-- The game code: flat classic scripts sharing one global scope
     (docs/dev/architecture.md). A file may reference names from any file at runtime, but its
     top-level (load-time) statements may only reference names from files loaded above it. -->
<script src="js/core.js"></script>
<!-- mobile.js before canvas.js: fitCanvas() asks MOBILE at load -->
<script src="js/mobile.js"></script>
<script src="js/canvas.js"></script>
<script src="js/player.js"></script>
<script src="js/input.js"></script>
<!-- the two other controllers, each a keyboard-and-mouse in disguise: they call
     input.js's keyPress/pointerPress and fold their sticks into sampleHumanInput -->
<script src="js/gamepad.js"></script>
<script src="js/touch.js"></script>
<script src="js/world.js"></script>
<script src="js/nav.js"></script>
<script src="js/wildlife.js"></script>
<script src="js/structures.js"></script>
<script src="js/robots.js"></script>
<script src="js/actions.js"></script>
<script src="js/tools.js"></script>
<script src="js/abilities.js"></script>
<script src="js/ai.js"></script>
<script src="js/sim.js"></script>
<!-- js/draw/: the world's pixels, cut from the one draw-world.js. ground.js first (every
     other draw file calls its hash2); render.js composes the frame and comes last. -->
<script src="js/draw/ground.js"></script>
<script src="js/draw/practice.js"></script>
<script src="js/draw/overhead.js"></script>
<script src="js/draw/structs.js"></script>
<script src="js/draw/bodies.js"></script>
<script src="js/draw/marks.js"></script>
<script src="js/draw/light.js"></script>
<script src="js/draw/render.js"></script>
<!-- js/ui/: the in-match HUD, cut from the one ui.js, in this order - four of its
     load-time constants read an earlier file's (AB_CELL, SHELF_X, CORNER_CLAIM, RAIL_PAD);
     then the screens: the shop, the panels, the menu and the end screens. -->
<script src="js/ui/wheel.js"></script>
<script src="js/ui/minimap.js"></script>
<script src="js/ui/bag.js"></script>
<script src="js/ui/strip.js"></script>
<script src="js/ui/hud-draw.js"></script>
<script src="js/ui/rail.js"></script>
<script src="js/ui/tooltip.js"></script>
<script src="js/ui/compose.js"></script>
<script src="js/ui/touch-plates.js"></script>
<script src="js/ui/shop.js"></script>
<script src="js/ui/panels.js"></script>
<script src="js/ui/menu.js"></script>
<script src="js/ui/chars.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
