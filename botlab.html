<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Softfall Bot Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0f16'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%235b6678'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%23ff8a5c'/%3E%3C/svg%3E">
<!-- The bot dev view's out-of-game page (docs/dev/botview.md). F6 in the game
     opens it as a window of the game's own, which sends it every bot's thought
     a few times a second; opened on its own it replays and compares saved
     logs. One file, no fetch: it works double-clicked, like index.html. -->
<style>
  :root {
    --bg: #0b0f16; --panel: #121822; --panel2: #161d29; --sel: #1b2230; --edge: #2c3544; --edge-hi: #5b6678;
    --ink: #d6dde8; --dim: #7d8699; --faint: #1c2230; --live: #7bd88f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 12px/1.4 ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; }
  body { display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  .sp { flex: 1; }
  .muted { color: var(--dim); }
  .ic { width: 12px; height: 12px; flex: none; vertical-align: -2px; }
  button, label.btn, select { background: var(--panel); color: var(--ink); border: 1px solid var(--edge-hi); padding: 3px 10px;
    font: inherit; cursor: pointer; height: 24px; }
  button:hover, label.btn:hover, select:hover { border-color: var(--ink); }
  button:disabled { opacity: 0.4; cursor: default; border-color: var(--edge); }
  button[aria-pressed="true"] { border-color: var(--ink); background: var(--sel); }
  .seg { display: flex; }
  .seg button + button { border-left: none; }
  .box { background: var(--panel); border: 1px solid var(--edge); min-width: 0; min-height: 0; }
  .hd { display: flex; align-items: center; gap: 8px; padding: 0 8px; height: 30px; border-bottom: 1px solid var(--edge); flex: none; }
  .lbl { color: var(--dim); letter-spacing: 1px; }

  header { flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 42px; border-bottom: 1px solid var(--edge); }
  header h1 { font-size: 13px; letter-spacing: 2px; margin: 0 6px 0 0; font-weight: 600; }
  #pick { max-width: 280px; padding: 0 6px; }
  #src { color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #src.live { color: var(--live); }
  #src.live::before { content: ""; width: 7px; height: 7px; background: var(--live); }
  #keys { color: var(--dim); border: 1px solid var(--edge); padding: 0 6px; cursor: help; height: 24px; line-height: 22px; }

  /* the match: blue's side left, the map between, red's right, the picked
     bot and the feed down the edge, the whole match along the bottom */
  main { flex: 1; min-height: 0; padding: 10px 12px 12px; position: relative; }
  #match { display: grid; gap: 10px;
    grid-template-columns: minmax(190px, 1fr) var(--mapw, 420px) minmax(190px, 1fr) minmax(240px, 21vw);
    grid-template-rows: 84px minmax(0, 1fr) auto;
    grid-template-areas: "sb0 clk sb1 side" "ros0 map ros1 side" "tl tl tl tl"; }
  #sb0 { grid-area: sb0; } #sb1 { grid-area: sb1; } #clk { grid-area: clk; }
  #ros0 { grid-area: ros0; } #ros1 { grid-area: ros1; } #mapc { grid-area: map; } #side { grid-area: side; } #tl { grid-area: tl; }

  .sb { --tc: var(--dim); padding: 7px 10px 0; border-top: 2px solid var(--tc); display: flex; flex-direction: column; gap: 5px; white-space: nowrap; overflow: hidden; }
  .sb .r1 { height: 20px; }
  .sb .r1, .sb .nerve { display: flex; align-items: center; gap: 8px; }
  .sb.r .r1, .sb.r .nerve, .sb.r .state { flex-direction: row-reverse; }
  .sb .sn { color: var(--tc); font-size: 13px; letter-spacing: 2px; }
  .sb .won { border: 1px solid var(--tc); color: var(--tc); padding: 0 5px; font-size: 11px; letter-spacing: 1px; }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 8px; height: 10px; background: var(--pc, var(--tc)); }
  .sb .state { display: flex; align-items: center; gap: 6px; color: var(--ink); letter-spacing: 1px; }
  .pips i.off { background: var(--faint); box-shadow: inset 0 0 0 1px var(--edge); }
  .kills { display: flex; align-items: center; gap: 4px; min-width: 34px; }
  .sb.r .kills { flex-direction: row-reverse; }
  .nb { flex: 1; height: 10px; background: var(--faint); display: block; position: relative; }
  .nb i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--tc); }
  .sb.r .nb i { left: auto; right: 0; }
  .nerve b { width: 38px; text-align: right; font-weight: normal; }
  .sb.r .nerve b { text-align: left; }
  .nerve .ic { color: var(--tc); }

  #clk { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #clock { font-size: 24px; line-height: 1; letter-spacing: 1px; }
  #sub { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 8px; }

  .ros { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: auto; }
  .card { --tc: var(--dim); flex: 1 1 0; min-height: 58px; max-height: 140px; background: var(--panel); border: 1px solid var(--edge);
    border-left: 3px solid var(--tc); padding: 5px 8px; display: flex; flex-direction: column; justify-content: center; gap: 3px; cursor: pointer; }
  .card:hover, .card.hov { background: var(--panel2); }
  .card.sel { border-color: var(--ink); border-left-color: var(--tc); background: var(--sel); }
  .card.dead { opacity: 0.45; }
  .card .c1, .card .c2, .card .c3 { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
  .card .nm { color: var(--tc); font-weight: 600; }
  .card .lv { font-size: 11px; }
  .card .kd { display: flex; gap: 8px; color: var(--dim); }
  .card .kd span { display: flex; align-items: center; gap: 3px; }
  .card .gl { font-size: 14px; font-weight: 600; letter-spacing: 1px; color: var(--ink); }
  .card .gl small { color: var(--dim); font-weight: normal; }
  .card.dim { opacity: 0.35; }
  .card .wy { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .card .hpw { flex: 1; display: flex; align-items: center; }
  .card .hp { flex: 1; height: 3px; }
  .card .hp i { background: #8f9cb3; }
  .card .held { color: var(--dim); display: flex; align-items: center; gap: 4px; font-size: 11px; }
  .card .held b { font-weight: normal; min-width: 28px; text-align: right; }
  .hpb { height: 4px; background: var(--faint); display: block; position: relative; }
  .hpb i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); opacity: 0.85; }
  .mix { display: flex; gap: 1px; height: 4px; background: var(--faint); }
  .mix i { display: block; height: 100%; min-width: 1px; }
  .mix.big { height: 10px; }

  #mapc { position: relative; overflow: hidden; background: #0e131b; }
  #map { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
  #zoom { position: absolute; right: 6px; top: 6px; color: var(--dim); background: rgba(11,15,22,0.8); padding: 0 6px; pointer-events: none; }
  #zoom:empty { display: none; }
  #heat { position: absolute; left: 6px; top: 6px; height: 20px; padding: 0 6px; font-size: 11px; background: rgba(11,15,22,0.8); border-color: var(--edge); }
  #heat[aria-pressed="true"] { border-color: var(--ink); }

  #side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #detail { flex: none; border-left: 3px solid var(--tc, var(--dim)); }
  #detail .bd { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  #detail .gl { font-size: 18px; font-weight: 600; letter-spacing: 1px; line-height: 1.1; }
  #detail .row .dot { width: 12px; height: 12px; }
  #detail .row { display: flex; align-items: center; gap: 8px; }
  #detail .stats { display: flex; gap: 12px; color: var(--dim); }
  #detail .stats > span { display: flex; align-items: center; gap: 4px; }
  #detail .stats b { color: var(--ink); font-weight: normal; }
  .opt { display: grid; grid-template-columns: 64px 1fr 34px; gap: 6px; align-items: center; }
  .opt .ob { height: 6px; background: var(--faint); position: relative; }
  .opt .ob i { position: absolute; left: 0; top: 0; bottom: 0; }
  .opt .os { color: var(--dim); text-align: right; }
  .keyrow { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--dim); }
  .keyrow span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 4px; background: var(--c); vertical-align: 0; }
  .dot { display: inline-block; width: 8px; height: 8px; background: var(--c); flex: none; }
  .x { margin-left: auto; height: 20px; padding: 0 6px; border-color: var(--edge); }

  #feedBox { flex: 1; display: flex; flex-direction: column; }
  #feedBox .seg button { height: 20px; padding: 0 6px; font-size: 11px; }
  #feed { flex: 1; overflow: auto; min-height: 0; padding: 4px 0; }
  .fi { display: flex; gap: 8px; padding: 2px 8px; align-items: center; cursor: pointer; white-space: nowrap; }
  .fi:hover { background: var(--panel2); }
  .fi.me { background: var(--sel); }
  .fi .ft { color: var(--dim); width: 36px; text-align: right; flex: none; }
  .fi .fb { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
  .fi .wy { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .fi .nb { width: 44px; flex: none; height: 6px; }

  #tl { display: flex; flex-direction: column; }
  #tl .hd { gap: 10px; }
  #play { width: 30px; padding: 0; display: flex; align-items: center; justify-content: center; }
  #tnow { min-width: 110px; }
  #legend { display: flex; flex-wrap: wrap; gap: 0 4px; justify-content: flex-end; overflow: hidden; max-height: 26px; }
  .lg { display: flex; align-items: center; gap: 4px; padding: 1px 6px; cursor: pointer; border: 1px solid transparent; }
  .lg i { width: 8px; height: 8px; background: var(--c); }
  .lg b { color: var(--dim); font-weight: normal; }
  .lg:hover, .lg.on { border-color: var(--edge-hi); }
  #tlwrap { position: relative; }
  #tlc { display: block; cursor: crosshair; }

  /* nothing to show yet: the two ways in */
  #welcome { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; gap: 20px; z-index: 2; }
  .way { width: 300px; height: 210px; border: 1px solid var(--edge); background: var(--panel); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; color: var(--dim); }
  .way b { color: var(--ink); font-size: 14px; letter-spacing: 2px; font-weight: 600; }
  .way kbd { font: inherit; font-size: 28px; color: var(--ink); border: 1px solid var(--edge-hi); border-bottom-width: 3px; padding: 6px 16px; }
  .way.drop { cursor: pointer; border-style: dashed; }
  .way.drop:hover, body.dragging .way.drop { border-color: var(--ink); }
  .way .ic { width: 40px; height: 40px; color: var(--ink); }
  body.dragging main { outline: 1px dashed var(--edge-hi); outline-offset: -6px; }

  /* every match, side by side */
  #compare { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-rows: auto minmax(0, 1fr); }
  #tiles { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tile { padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
  .tile b { font-size: 24px; font-weight: normal; line-height: 1.1; }
  .tile span { color: var(--dim); letter-spacing: 1px; }
  #lv, #ml { display: flex; flex-direction: column; }
  #lv .bd, #ml .bd { flex: 1; overflow: auto; min-height: 0; }
  table { border-collapse: collapse; width: 100%; }
  th { color: var(--dim); font-weight: normal; text-align: left; position: sticky; top: 0; background: var(--panel); padding: 6px 8px; cursor: default; white-space: nowrap; }
  th[data-sort] { cursor: pointer; }
  th[data-sort]:hover { color: var(--ink); }
  td { padding: 5px 8px; white-space: nowrap; border-top: 1px solid var(--faint); }
  td.n, th.n { text-align: right; }
  tr[data-m] { cursor: pointer; }
  tr[data-m]:hover td { background: var(--panel2); }
  tr.sel td { background: var(--sel); }
  .vb { display: flex; align-items: center; gap: 6px; }
  .vb .hpb { flex: 1; min-width: 50px; height: 6px; }
  .vb .hpb i { background: var(--c, var(--edge-hi)); opacity: 1; }
  .sw { display: inline-block; width: 10px; height: 10px; background: var(--c); vertical-align: -1px; }
  .lvrow { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; padding: 5px 10px; }
  .sec { color: var(--dim); letter-spacing: 1px; padding: 10px 10px 4px; }

  #tip { position: fixed; z-index: 9; pointer-events: none; background: rgba(12,16,24,0.96); border: 1px solid var(--edge-hi);
    padding: 5px 8px; max-width: 340px; display: none; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>BOT LAB</h1>
  <nav class="seg"><button data-view="match" aria-pressed="true">MATCH</button><button data-view="compare" aria-pressed="false">COMPARE</button></nav>
  <select id="pick" hidden></select>
  <span id="src"></span>
  <span class="sp"></span>
  <span id="keys" data-tip="space play &#183; &larr; &rarr; step 1 s (shift 10 s) &#183; home / end &#183; &uarr; &darr; next bot &#183; esc let go &#183; F follow on a zoomed map &#183; H heat &#183; wheel zoom &#183; drag pan &#183; double-click whole map &#183; 1 / 2 views">KEYS</span>
  <label class="btn">OPEN<input id="open" type="file" accept=".json,.jsonl,application/json" multiple hidden></label>
  <button id="save" disabled>SAVE</button>
</header>
<main id="match">
  <section id="sb0" class="sb box"></section>
  <section id="clk" class="box"><div id="clock">0:00</div><div id="sub"></div></section>
  <section id="sb1" class="sb box r"></section>
  <div id="ros0" class="ros"></div>
  <div id="mapc" class="box"><canvas id="map"></canvas><button id="heat" aria-pressed="false" data-tip="where each side has stood so far (H)">HEAT</button><span id="zoom"></span></div>
  <div id="ros1" class="ros"></div>
  <aside id="side">
    <section id="detail" class="box" hidden></section>
    <section id="feedBox" class="box">
      <div class="hd"><span class="lbl">FEED</span><span class="sp"></span>
        <nav class="seg"><button data-feed="key" aria-pressed="true" data-tip="kills, birds, pushes and retreats, and the picked bot's every goal">KEY</button><button data-feed="all" aria-pressed="false" data-tip="every goal change too">ALL</button></nav></div>
      <div id="feed"></div>
    </section>
  </aside>
  <section id="tl" class="box">
    <div class="hd"><button id="play" data-tip="play (space)"></button><button id="speed" data-tip="replay speed">1x</button><span id="tnow"></span><span class="sp"></span><div id="legend"></div></div>
    <div id="tlwrap"><canvas id="tlc"></canvas></div>
  </section>
  <div id="welcome">
    <div class="way"><kbd>F6</kbd><b>WATCH LIVE</b><span id="wait">in the game</span></div>
    <div class="way drop" id="dropWay" data-tip="a saved botlog (SAVE here), arena match files with their map file, a run's summary.jsonl, ladder records"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v11M7 10l5 5 5-5M4 19h16"/></svg><b>OPEN LOGS</b><span>drop or click</span></div>
  </div>
</main>
<main id="compare" hidden>
  <div id="tiles"></div>
  <section id="lv" class="box"><div class="hd"><span class="lbl">BY LEVEL</span></div><div class="bd"></div></section>
  <section id="ml" class="box"><div class="hd"><span class="lbl">MATCHES</span><span class="sp"></span><span class="muted">click one to watch it</span></div><div class="bd"></div></section>
</main>
<div id="tip"></div>
<script>
'use strict';
// what a goal is FOR: six kinds, one colour each. The words (GATHER,
// MINE...) say the rest, so colour stays a small mark and the text plain ink.
// The four that change a match are loud; FARM and ROAM, most of any match,
// are quiet, so a fight or a push is what the eye finds. Checked as a set on
// the panel for colour-blind separation in exactly this stacking order
// (bottom of a stack first); none is the red or the blue the two sides wear.
// The game's own F4 view paints the same (BOT_GOALS, js/ui/botview.js),
// ROAM aside; a match log's activities (match-log.md `act`) sit in the kind
// they belong to.
const KINDS = [
  { k: 'PUSH', col: '#d55181', word: 'PUSHING', goals: ['PUSH', 'RALLY', 'REGROUP', 'SIEGE'] },
  { k: 'RETREAT', col: '#c98500', word: 'FALLING BACK', goals: ['FLEE', 'HIDE'] },
  { k: 'DEFEND', col: '#9085e9', word: 'DEFENDING', goals: ['DEFEND', 'GUARD', 'ESCORT', 'FOLLOW', 'HELP'] },
  { k: 'FIGHT', col: '#d95926', word: 'FIGHTING', goals: ['FIGHT', 'WOLF', 'STALK'] },
  { k: 'FARM', col: '#3b8f72', word: 'FARMING', goals: ['GATHER', 'MINE', 'HUNT', 'EAT', 'LOOT', 'BUILD', 'SPEND', 'SHOP', 'FORGE', 'WORK'] },
  { k: 'ROAM', col: '#3a4150', word: 'ROAMING', goals: ['ROAM', 'IDLE', 'MOVE', 'SCOUT', 'ORDER'] },
];
const KIND_OF = {};
for (const K of KINDS) { KIND_OF[K.k] = K; for (const g of K.goals) KIND_OF[g] = K; }
const DEAD_COL = '#232a37';
// a goal (or a kind) to its kind's key; a word nobody filed yet counts as ROAM
const kindKey = (g) => g === 'DEAD' ? 'DEAD' : KIND_OF[g] ? KIND_OF[g].k : 'ROAM';
const gc = (g) => g === 'DEAD' ? DEAD_COL : KIND_OF[g] ? KIND_OF[g].col : '#8f9cb3';
// the kind's mark beside a word
const sw = (g) => '<i class="dot" style="--c:' + gc(g) + '"></i>';
// a level is a word in plain ink; only a person stands out
const LEVELS = { PLAYER: '#d6dde8', HUMAN: '#d6dde8' };
const RED = '#e0575b', BLUE = '#4f8fe0'; // a saved match's paint: seat 0's side blue, as the game deals it
const WORLD_PX = 3712;                   // WORLD * TILE today, for a log that does not say
const EAGLE_MAX = 2000;                  // EAGLE_HP (boot.js), for a log that does not say
const TRAIL_S = 20;                      // s of path drawn behind each bot
const KILL_S = 12;                       // s a kill's cross stays on the map
const SPEEDS = [1, 4, 10, 30];           // replay speeds, match seconds per second
const NAME_W = 76;                       // the timeline's name column, px
const FEED_MAX = 250;                    // feed lines drawn at once
const lc = (l) => LEVELS[l] || '#7d8699';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = (t) => { t = Math.max(0, t || 0); return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// the last item of a time-ordered list at or before t, or -1
function lastAt(list, t) {
  let lo = 0, hi = list.length - 1, at = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (list[mid].t <= t) { at = mid; lo = mid + 1; } else hi = mid - 1; }
  return at;
}
const ICON = {
  kill: '<svg class="ic" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.8"/></svg>',
  down: '<svg class="ic" viewBox="0 0 12 12"><path d="M6 2v7M3 6.5L6 9.5 9 6.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
  bird: '<svg class="ic" viewBox="0 0 12 12"><path d="M0.5 4.5L6 7.5 11.5 4.5 10 7.5 6 10 2 7.5z" fill="currentColor"/></svg>',
  flip: '<svg class="ic" viewBox="0 0 12 12"><path d="M2 4h8M7.5 1.5L10 4 7.5 6.5M10 8H2M4.5 5.5L2 8l2.5 2.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>',
  to: '<svg class="ic" viewBox="0 0 12 12"><path d="M4 2.5L7.5 6 4 9.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
  play: '<svg class="ic" viewBox="0 0 12 12"><path d="M3 1.5l7.5 4.5L3 10.5z" fill="currentColor"/></svg>',
  pause: '<svg class="ic" viewBox="0 0 12 12"><path d="M2.5 1.5h2.5v9H2.5zM7 1.5h2.5v9H7z" fill="currentColor"/></svg>',
  heart: '<svg class="ic" viewBox="0 0 12 12"><path d="M6 10.5L1.5 6A2.4 2.4 0 0 1 6 3a2.4 2.4 0 0 1 4.5 3z" fill="currentColor"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" stroke="currentColor" fill="none" stroke-width="1.3"/><path d="M6 3.5V6l1.8 1.2" stroke="currentColor" fill="none" stroke-width="1.3"/></svg>',
};

// ---- state. A MATCH is one normalised shape whatever file it came from:
// { id, from, seed, len, world, winner, fun, sides: [{ name, col }] by team,
// bots: [{ id, name, team, col, level, cls, kills, deaths, dmgOut, siege,
// time }], people, timeKind: 'goal' | 'act', events: goal changes [{ t, id,
// goal, why, guess }], kills: [{ t, a, v, x, y }], birdEv: [{ t, kind, team,
// hp, max, by }], birdsT: [{ t, e: [[hp, max, state]] by team }],
// at(t) -> { bots, birds }, trail(id, t) -> [[x, y]], lanes() -> Map(id ->
// [[t0, t1, goal, why, guess]]), map, raw }
const S = {

  const c = current();
  S.c = c;
  $('welcome').hidden = !!c;
  transport(c);
  if (!c) return;
  scoreboard(c); roster(c);
  if (!S.down) { detail(c); feed(c); }
  drawTimeline(c);
  // the map is as tall as the row the timeline leaves it, and square
  const cell = $('mapc'), main = $('match');
  const room = main.clientWidth - 24 - $('side').offsetWidth - 2 * 190 - 30;
  main.style.setProperty('--mapw', Math.max(220, Math.min(cell.clientHeight, room)) + 'px');
  drawMap(c);
}
function transport(c) {
  const rp = replaying();
  $('play').innerHTML = S.playing ? ICON.pause : ICON.play;
  $('play').disabled = !rp; $('speed').disabled = !rp;
  $('speed').textContent = S.speed + 'x';
  $('tnow').innerHTML = !c ? '' : c.live ? '<span style="color:var(--live)">LIVE</span> ' + mmss(c.t) : mmss(c.t) + ' <span class="muted">/ ' + mmss(c.len) + '</span>';
}

// what a side is doing as a whole: a push, a fight, a stand or a retreat
// once two of its bots are on it, else whatever most of them are doing
function sideState(bots) {
  const live = bots.filter((b) => !b.dead);
  if (!bots.length) return null;
  if (!live.length) return { word: 'ALL DOWN', col: DEAD_COL };
  const n = {};
  for (const b of live) { const k = kindKey(b.goal); n[k] = (n[k] || 0) + 1; }
  for (const k of ['PUSH', 'FIGHT', 'DEFEND', 'RETREAT']) if (n[k] >= 2) return KIND_OF[k];
  let best = null;
  for (const K of KINDS) if (n[K.k] && (!best || n[K.k] > n[best.k])) best = K;
  return best;
}
// the two sides' strips: what the side is doing, a pip per seat in the
// colour of what it is doing (dark once down), its kills, its bird
function scoreboard(c) {
  c.order.forEach((team, i) => {
    const s = c.sides[team], el = $('sb' + i);
    const crew = c.bots.filter((b) => b.team === team).concat(c.people.filter((h) => h.team === team)).sort((a, b) => a.id - b.id);
    const kills = crew.reduce((a, b) => a + (b.kills | 0), 0);
    const bird = c.birds.find((b) => b.team === team);
    const nerve = !bird ? null : bird.state === 'flee' || bird.state === 'gone' ? 0 : clamp(bird.hp / bird.max, 0, 1);
    const pct = nerve === null ? null : Math.round(nerve * 100);
    const st = sideState(c.bots.filter((b) => b.team === team)), human = (b) => c.people.includes(b);
    el.style.setProperty('--tc', s.col);
    el.innerHTML = '<div class="r1"><b class="sn">' + esc(s.name) + '</b>' + (c.over && c.winner === team ? '<span class="won">WON</span>' : '') +
      '<span class="sp"></span><span class="kills" data-tip="kills">' + ICON.kill + '<b>' + kills + '</b></span></div>' +
      '<div class="r1">' + (st ? '<span class="state" data-tip="what this side is doing">' + '<i class="dot" style="--c:' + st.col + '"></i>' + st.word + '</span>' : '') +
      '<span class="sp"></span><span class="pips">' + crew.map((b) => '<i' + (b.dead ? ' class="off"' : '') + ' style="--pc:' + (human(b) ? '#d6dde8' : gc(b.goal)) +
        '" data-tip="' + esc(b.name + (b.dead ? ' down' : human(b) ? '' : ' ' + (b.goal || ''))) + '"></i>').join('') + '</span></div>' +
      '<div class="nerve" data-tip="bird\'s nerve: at 0 it leaves and the side is out">' + ICON.bird + '<span class="nb"><i style="width:' + (pct || 0) + '%"></i></span><b>' +
      (pct === null ? '<span class="muted">-</span>' : pct + '%') + '</b></div>';
  });
  $('clock').textContent = mmss(c.t);
  $('sub').textContent = c.live ? 'seed ' + c.seed : c.id;
}

// a card per bot, blue's down the left and red's down the right, built once
// per match and refreshed in place
function roster(c) {
  const lanes = lanesNow(c);
  c.order.forEach((team, i) => {
    const el = $('ros' + i);
    const crew = c.bots.filter((b) => b.team === team).concat(c.people.filter((h) => h.team === team).map((h) => Object.assign({ human: true }, h)))
      .sort((a, b) => a.id - b.id);
    const key = c.id + ':' + crew.map((b) => b.id).join(',');
    if (el.dataset.key !== key) {
      el.dataset.key = key;
      el.innerHTML = crew.map((b) => '<div class="card" data-id="' + b.id + '"><div class="c1"><b class="nm"></b><span class="lv"></span><span class="sp"></span>' +
        '<span class="kd"><span data-tip="kills">' + ICON.kill + '<b class="k"></b></span><span data-tip="deaths">' + ICON.down + '<b class="d"></b></span></span></div>' +
        '<div class="c2"><i class="dot"></i><span class="gl"></span><span class="wy"></span></div>' +
        '<div class="c3"><span class="hpw" data-tip="health"><span class="hp hpb"><i></i></span></span></div></div>').join('');
      for (const card of el.children) {
        card.onclick = () => select(S.sel === +card.dataset.id ? -1 : +card.dataset.id);
        card.onmouseenter = () => { S.hover = +card.dataset.id; render(); };
        card.onmouseleave = () => { if (S.hover === +card.dataset.id) { S.hover = -1; render(); } };
      }
    }
    for (const b of crew) {
      const card = el.querySelector('[data-id="' + b.id + '"]');
      if (!card) continue;
      card.style.setProperty('--tc', b.col);
      card.classList.toggle('sel', b.id === S.sel);
      card.classList.toggle('hov', b.id === S.hover);
      card.classList.toggle('dead', !!b.dead);
      const hi = S.goalPin || S.goalHi;
      card.classList.toggle('dim', !!hi && !b.human && kindKey(b.goal) !== hi);
      card.querySelector('.nm').textContent = b.name;
      const lv = card.querySelector('.lv');
      lv.textContent = b.human ? 'PLAYER' : b.level; lv.style.color = lc(b.human ? 'PLAYER' : b.level);
      card.querySelector('.k').textContent = b.kills | 0;
      card.querySelector('.d').textContent = b.deaths | 0;
      const gl = card.querySelector('.gl'), dot = card.querySelector('.c2 .dot');
      const goal = b.human ? (b.dead ? 'DEAD' : '') : b.goal || '';
      const seg = b.human ? null : segAt(lanes, b.id, c.t);
      gl.innerHTML = esc(goal) + (guessMark(c, b) ? '<small>?</small>' : '');
      gl.dataset.tip = !goal ? '' : (KIND_OF[goal] ? KIND_OF[goal].k : goal) + (seg && !b.dead ? ' for ' + mmss(c.t - seg[0]) : '') +
        (guessMark(c, b) ? ' (guessed from what it is doing)' : '');
      dot.style.setProperty('--c', gc(goal)); dot.style.visibility = goal ? '' : 'hidden';
      card.querySelector('.wy').textContent = b.why || '';
      const hp = card.querySelector('.hp i');
      card.querySelector('.hpw').style.visibility = b.hp == null || !b.maxHp ? 'hidden' : '';
      if (b.maxHp) hp.style.width = clamp(100 * b.hp / b.maxHp, 0, 100) + '%';
    }
  });
}
// time by goal, summed into its kinds
const KIND_KEYS = KINDS.map((K) => K.k).concat('DEAD');

function byKind(tm) {
  const out = {};

  return out;
}

  let sum = 0; for (const k in tm) sum += tm[k];
  return { sum, order: Object.keys(tm).filter((k) => tm[k] > 0).sort((a, b) => tm[b] - tm[a]) };
}

// two bars compare segment for segment
function mixBar(tm) {
  const { sum } = shares(tm);
  return sum ? KIND_KEYS.filter((k) => tm[k] > 0).map((k) => '<i style="width:' + (100 * tm[k] / sum).toFixed(2) + '%;background:' + gc(k) + '"></i>').join('') : '';
}

// the '?' of a goal the page guessed: only where a brain could have said
// (a match file's activities are the sim's own word, never a thought)
function guessMark(c, b) { return b.guess && b.goal && b.goal !== 'DEAD' && c.timeKind === 'goal'; }

// the picked bot, close up: what it wants, why, what else it weighed

  if (!b) { el.hidden = true; return; }
  el.hidden = false;
  el.style.setProperty('--tc', b.col);
  const lanes = lanesNow(c), human = c.people.includes(b);
  const time = human ? {} : byKind(timeOf(lanes, b.id, c.t)), seg = human ? null : segAt(lanes, b.id, c.t), sh = shares(time);
  const opts = (b.options || []).slice(0, 5), top = Math.max(1e-6, ...opts.map((o) => +o.score || 0));
  el.innerHTML = '<div class="hd"><b style="color:' + b.col + '">' + esc(b.name) + '</b><span style="color:' + lc(human ? 'PLAYER' : b.level) + '">' + esc(human ? 'PLAYER' : b.level) + '</span>' +
    '<span class="muted">' + esc(b.cls || '') + '</span><button class="x" id="unsel" data-tip="let go (esc)">' + ICON.kill + '</button></div><div class="bd">' +
    (human ? '' : '<div class="row">' + sw(b.goal) + '<span class="gl">' + esc(b.goal) + (guessMark(c, b) ? '<span class="muted" data-tip="guessed from what it is doing">?</span>' : '') + '</span><span class="sp"></span>' +
      (seg ? '<span class="muted" data-tip="on this goal for">' + ICON.clock + ' ' + mmss(c.t - seg[0]) + '</span>' : '') + '</div>' +
      (b.why ? '<div>' + esc(b.why) + '</div>' : '') +
      (b.role || b.mood ? '<div class="muted">' + esc([b.role, b.mood].filter(Boolean).join(' / ')) + '</div>' : '') +
      (b.plan ? '<div class="muted">' + esc(b.plan) + '</div>' : '') +
      (opts.length ? '<div>' + opts.map((o) => '<div class="opt"><span>' + esc(o.goal) + '</span><span class="ob"><i style="width:' +
        clamp(100 * (+o.score || 0) / top, 0, 100) + '%;background:' + gc(o.goal) + '"></i></span><span class="os">' + (+o.score).toFixed(2) + '</span></div>').join('') + '</div>' : '') +
      (sh.sum ? '<span class="mix big" data-tip="' + esc(shareText(time)) + '">' + mixBar(time) + '</span><div class="keyrow">' +
        sh.order.slice(0, 4).map((k) => '<span style="--c:' + gc(k) + '">' + esc(k) + ' ' + Math.round(100 * time[k] / sh.sum) + '%</span>').join('') + '</div>' : '')) +
    '<div class="stats">' + (b.hp != null && b.maxHp ? '<span data-tip="health">' + ICON.heart + '<b>' + Math.max(0, b.hp | 0) + '</b><span>/' + b.maxHp + '</span></span>' : '') +
    '<span data-tip="kills">' + ICON.kill + '<b>' + (b.kills | 0) + '</b></span><span data-tip="deaths">' + ICON.down + '<b>' + (b.deaths | 0) + '</b></span>' +
    (b.dmgOut != null ? '<span data-tip="damage dealt">dmg <b>' + (b.dmgOut | 0) + '</b></span>' : '') + '</div></div>';

}

// ---- the feed, newest first: kills, the birds' nerve, every bot turning
// to a side's business (KEY_GOALS) and everything the picked bot decides
// (ALL: every goal change). A bot flipping between two goals is one line.
// A line picks its bot and jumps the replay there.
const KEY_GOALS = ['PUSH', 'RALLY', 'REGROUP', 'DEFEND', 'GUARD', 'ESCORT', 'HELP', 'FLEE', 'HIDE', 'SIEGE'];
const FEED_SCAN = 20000;        // goal changes the feed reads back through, newest first
const FLIP_S = 15;             // s between changes that still count as one flip-flop
function feed(c) {
  const sel = S.sel;
  const key = [c.id, c.kills.length, c.birdEv.length, c.events.length, sel, S.feedAll].join(':');
  if ($('feed').dataset.key === key) return;
  $('feed').dataset.key = key;
  const items = [];
  for (const k of c.kills) items.push({ t: k.t, kind: 'kill', a: k.a, v: k.v });
  for (const e of c.birdEv) items.push(e);
  // goal changes, newest first, folded per bot: a run of three or more changes
  // among two goals, each within FLIP_S of the next, is one flip line. The
  // fold reads every change and the filter comes after, so a flip shows the
  // pair it really is, even when only one of the two is a key goal
  const runs = new Map(), goals = [];
  const keep = (x) => S.feedAll || x.id === sel || (x.kind === 'flip' ? x.goals.some((g) => KEY_GOALS.includes(g)) : KEY_GOALS.includes(x.goal));
  const close = (r) => {
    if (r.evs.length >= 3) { const f = { t: r.evs[0].t, kind: 'flip', id: r.id, goals: r.goals.sort(), n: r.evs.length }; if (keep(f)) goals.push(f); }
    else for (const e of r.evs) if (keep(e)) goals.push(e);
  };
  const evs = c.events;
  for (let i = evs.length - 1; i >= 0 && i >= evs.length - FEED_SCAN; i--) {
    const e = evs[i];
    const g = { t: e.t, kind: 'goal', id: e.id, goal: e.goal, why: e.why, guess: e.guess };
    const r = runs.get(e.id), last = r && r.evs[r.evs.length - 1];
    if (r && last.t - e.t <= FLIP_S && (r.goals.includes(e.goal) || r.goals.length < 2)) {
      r.evs.push(g); if (!r.goals.includes(e.goal)) r.goals.push(e.goal);
    } else {
      if (r) close(r);
      runs.set(e.id, { id: e.id, evs: [g], goals: [e.goal] });
    }
  }
  for (const r of runs.values()) close(r);
  items.push(...goals);
  items.sort((a, b) => b.t - a.t);
  const name = (id) => { const b = c.who.get(id); return b ? '<b style="color:' + b.col + '">' + esc(b.name) + '</b>' : '<b class="muted">?</b>'; };
  const word = (g, guess) => sw(g) + '<b>' + esc(g) + (guess && c.timeKind === 'goal' && g !== 'DEAD' ? '?' : '') + '</b>';
  $('feed').innerHTML = items.slice(0, FEED_MAX).map((e) => {
    let body = '', who = -1, mine = false;
    if (e.kind === 'kill') {
      who = e.a >= 0 ? e.a : e.v; mine = sel >= 0 && (e.a === sel || e.v === sel);
      body = (e.a >= 0 ? name(e.a) : '') + '<span class="muted">' + ICON.kill + '</span>' + name(e.v);
    } else if (e.kind === 'bird' || e.kind === 'flee') {
      const s = c.sides[e.team] || { name: '?', col: '#888' }, pct = e.kind === 'flee' ? 0 : Math.round(100 * e.hp / (e.max || EAGLE_MAX));
      who = e.by >= 0 ? e.by : -1; mine = sel >= 0 && e.by === sel;
      body = '<span style="color:' + s.col + '">' + ICON.bird + '</span><span class="nb" style="--tc:' + s.col + '"><i style="width:' + pct + '%"></i></span>' +
        (e.kind === 'flee' ? '<b style="color:' + s.col + '">GONE</b>' : pct + '%') + (e.by >= 0 ? '<span class="muted">' + ICON.kill + '</span>' + name(e.by) : '');
    } else if (e.kind === 'flip') {
      who = e.id; mine = e.id === sel;
      body = name(e.id) + '<span class="muted">x' + e.n + '</span>' + e.goals.map((g) => word(g)).join('<span class="muted" data-tip="flipping between the two">' + ICON.flip + '</span>');
    } else {
      who = e.id; mine = e.id === sel;
      body = name(e.id) + '<span class="muted">' + ICON.to + '</span>' + word(e.goal, e.guess) + '<span class="wy">' + esc(e.why || '') + '</span>';
    }
    return '<div class="fi' + (mine ? ' me' : '') + '" data-t="' + e.t + '" data-id="' + who + '"><span class="ft">' + mmss(e.t) + '</span><span class="fb">' + body + '</span></div>';
  }).join('') || '<div class="fi muted">all quiet</div>';
}
$('feed').onclick = (ev) => {
  const fi = ev.target.closest('.fi[data-t]');
  if (!fi) return;

  if (id >= 0) S.sel = id;
  if (replaying()) seek(+fi.dataset.t); else render();
};
for (const b of document.querySelectorAll('[data-feed]')) b.onclick = () => {
  S.feedAll = b.dataset.feed === 'all';
  for (const o of document.querySelectorAll('[data-feed]')) o.setAttribute('aria-pressed', String(o === b));
  render();
};
// a click in the edge column lands on what it pressed, not a fresh copy the
// next live frame built between the press and the release
$('side').addEventListener('mousedown', () => { S.down = true; });
window.addEventListener('mouseup', () => { if (S.down) { S.down = false; setTimeout(render, 0); } });

// ---- the map: the whole world, or a zoomed part of it (wheel to zoom at the
// pointer, drag to pan, double-click for the whole map again, F to follow
// the picked bot)
const cv = $('map'), g = cv.getContext('2d');
let hits = [];
function viewOf() { return S.mview || { x0: 0, y0: 0, span: S.world || WORLD_PX }; }
function terrainOf(c) {

  if (!m.map && m.raw) {
    const t = m.raw.map && m.raw.map.rgb ? m.raw.map : m.raw.mapFile ? S.maps.get(m.raw.mapFile) : null;
    if (t) m.map = rgbCanvas(t);

  const focus = S.hover >= 0 ? S.hover : S.sel, hi = S.goalPin || S.goalHi;
  const faded = (b) => (focus >= 0 && b.id !== focus) || (hi && kindKey(b.goal) !== hi);

// averaged over every match that carries them: which part drags it down
const FUN_PARTS = {
  close: 'the loser nearly won', swings: 'the lead changed hands', comeback: 'the winner was clearly behind once', length: '12-18 min',
  action: 'fights keep coming', busy: 'nobody stands around', spread: 'the whole map gets used', variety: 'bots do many things',
};
function funParts(ms, vb) {
  const sum = {}; let n = 0;
  for (const { m } of ms) {
    const f = m.raw && m.raw.fun;
    if (!f || !f.parts) continue;
    n++;
    for (const k in f.parts) sum[k] = (sum[k] || 0) + (+f.parts[k] || 0);
  }
  if (!n) return '';
  return '<div class="sec">FUN, PART BY PART</div>' + Object.keys(sum).map((k) => '<div class="lvrow" data-tip="' + esc(FUN_PARTS[k] || k) + '"><span>' + esc(k.toUpperCase()) + '</span>' +
    vb(sum[k] / n, 1, Math.round(100 * sum[k] / n) + '%', '#8fb4d9') + '</div>').join('');
}
function compare() {
  const ms = allMatches();
  const winSide = (m) => m.winner === 0 || m.winner === 1 ? (m.sides || [])[m.winner] || null : null;
  const lens = ms.map((x) => x.m.len || 0), funs = ms.map((x) => x.m.fun).filter((f) => f != null);
  const kills = ms.map((x) => x.m.bots.reduce((s, b) => s + (b.kills | 0), 0));
  const wins = { BLUE: 0, RED: 0 };
  for (const { m } of ms) { const s = winSide(m); if (s) wins[s.name] = (wins[s.name] || 0) + 1; }
  const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const tile = (v, l, tip) => '<div class="tile box"' + (tip ? ' data-tip="' + esc(tip) + '"' : '') + '><b>' + v + '</b><span>' + l + '</span></div>';
  $('tiles').innerHTML = tile(ms.length, 'MATCHES') + tile(ms.length ? mmss(avg(lens)) : '-', 'AVG LENGTH') +
    tile(funs.length ? Math.round(avg(funs)) : '-', 'AVG FUN', 'the fun-tests score, 0-100 (match-log.md)') +
    tile(ms.length ? avg(kills).toFixed(1) : '-', 'KILLS / MATCH') +
    tile('<span style="color:' + BLUE + '">' + wins.BLUE + '</span> <span class="muted">-</span> <span style="color:' + RED + '">' + wins.RED + '</span>', 'WINS BLUE - RED');
  // by level: per-bot averages, each column's bar against its own biggest
  const by = new Map();
  for (const { m } of ms) for (const b of m.bots) {
    let r = by.get(b.level);
    if (!r) by.set(b.level, r = { level: b.level, n: 0, k: 0, d: 0, dmg: 0, siege: 0, goal: {}, act: {} });
    r.n++; r.k += b.kills | 0; r.d += b.deaths | 0; r.dmg += b.dmgOut | 0; r.siege += b.siege | 0;
    const into = m.timeKind === 'act' ? r.act : r.goal;
    for (const gk in b.time || {}) into[gk] = (into[gk] || 0) + b.time[gk];
  }
  const rows = [...by.values()];
  for (const r of rows) { r.time = byKind(Object.keys(r.goal).length ? r.goal : r.act); r.kd = r.k / Math.max(1, r.d); r.k /= r.n; r.d /= r.n; r.dmg /= r.n; r.siege /= r.n; }
  const top = (f) => Math.max(1e-6, ...rows.map(f));
  const vb = (v, mx, txt, col) => '<span class="vb" style="--c:' + (col || '#5b6678') + '"><span class="hpb"><i style="width:' + (100 * v / mx).toFixed(1) + '%"></i></span>' + txt + '</span>';
  const tK = top((r) => r.k), tKD = top((r) => r.kd), tDmg = top((r) => r.dmg), tS = top((r) => r.siege);
  $('lv').querySelector('.bd').innerHTML = !rows.length ? '<div class="sec">-</div>' :
    '<table><thead><tr><th>LEVEL</th><th class="n">BOTS</th><th>KILLS</th><th>K / D</th><th>DAMAGE</th><th>SIEGE</th></tr></thead><tbody>' +
    rows.map((r) => '<tr><td style="color:' + lc(r.level) + '">' + esc(r.level) + '</td><td class="n">' + r.n + '</td><td>' + vb(r.k, tK, r.k.toFixed(1)) + '</td><td>' +
      vb(r.kd, tKD, r.kd.toFixed(2)) + '</td><td>' + vb(r.dmg, tDmg, Math.round(r.dmg)) + '</td><td>' + vb(r.siege, tS, Math.round(r.siege)) + '</td></tr>').join('') +
    '</tbody></table><div class="sec">HOW THEY SPEND THEIR TIME</div>' +
    rows.map((r) => '<div class="lvrow"><span style="color:' + lc(r.level) + '">' + esc(r.level) + '</span><span class="mix big" data-tip="' + esc(shareText(r.time)) + '">' + mixBar(r.time) + '</span></div>' +
      '<div class="lvrow"><span></span><div class="keyrow">' + shares(r.time).order.slice(0, 6).map((k) => '<span style="--c:' + gc(k) + '">' + esc(k) + ' ' +
        Math.round(100 * r.time[k] / shares(r.time).sum) + '%</span>').join('') + '</div></div>').join('') + funParts(ms, vb);
  // the matches, sortable, the length and fun as bars so a slow or dull one stands out
  const list = ms.map((x, j) => Object.assign({ j, kills: kills[j], win: winSide(x.m) }, x));
  const sk = { i: (x) => x.j, len: (x) => x.m.len || 0, fun: (x) => x.m.fun == null ? -1 : x.m.fun, kills: (x) => x.kills, win: (x) => x.win ? x.win.name : '' }[cmpSort.key] || ((x) => x.j);
  list.sort((a, b) => (sk(a) > sk(b) ? 1 : sk(a) < sk(b) ? -1 : 0) * cmpSort.dir);
  const tLen = Math.max(1, ...lens), tKill = Math.max(1, ...kills);
  const levels = (m) => m.ladder ? esc(m.ladder.a) + ' <span class="muted">v</span> ' + esc(m.ladder.b) :
    [...new Set(m.bots.map((b) => b.level))].map((l) => '<span style="color:' + lc(l) + '">' + esc(l) + '</span>').join(' ');
  const th = (k, t, cls) => '<th' + (cls ? ' class="' + cls + '"' : '') + ' data-sort="' + k + '">' + t + (cmpSort.key === k ? (cmpSort.dir > 0 ? ' &#9652;' : ' &#9662;') : '') + '</th>';
  $('ml').querySelector('.bd').innerHTML = !list.length ? '<div class="sec">-</div>' :
    '<table><thead><tr>' + th('i', 'MATCH') + '<th>BOTS</th>' + th('len', 'LENGTH') + th('win', 'WINNER') + th('fun', 'FUN') + th('kills', 'KILLS') + '</tr></thead><tbody>' +
    list.map(({ i, m, kills: k, win }) => '<tr' + (i !== null && m.at ? ' data-m="' + i + '"' : '') + (m === S.cur || (i === -1 && S.cur === 'live') ? ' class="sel"' : '') + '>' +
      '<td data-tip="' + esc(m.from || '') + '">' + esc(m.id) + '</td><td>' + levels(m) + '</td><td>' + vb(m.len || 0, tLen, mmss(m.len || 0)) + '</td>' +
      '<td>' + (win ? '<span class="sw" style="--c:' + win.col + '"></span> ' + esc(win.name) : '<span class="muted">-</span>') + '</td>' +
      '<td>' + (m.fun == null ? '<span class="muted">-</span>' : vb(m.fun, 100, m.fun, '#8fb4d9')) + '</td><td>' + vb(k, tKill, k) + '</td></tr>').join('') + '</tbody></table>';
  for (const t of $('ml').querySelectorAll('th[data-sort]')) t.onclick = () => {
    cmpSort.dir = cmpSort.key === t.dataset.sort ? -cmpSort.dir : 1; cmpSort.key = t.dataset.sort; compare();
  };
  for (const tr of $('ml').querySelectorAll('tr[data-m]')) tr.onclick = () => { const i = +tr.dataset.m; if (i < 0) { openLive(); view('match'); } else open(S.matches[i]); };
}
$('compare').addEventListener('mousedown', () => { S.down = true; });

// ---- the one tooltip: anything with data-tip, and the canvases' own
const tip = $('tip');
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 6, ev.clientX + 14) + 'px';
  tip.style.top = (ev.clientY + 14 + h > window.innerHeight ? ev.clientY - h - 10 : ev.clientY + 14) + 'px';
}
function hideTip() { tip.style.display = 'none'; }
document.addEventListener('mousemove', (ev) => {
  if (ev.target === cv || ev.target === tc2) return;
  const el = ev.target.closest && ev.target.closest('[data-tip]');
  if (el && el.dataset.tip) showTip(esc(el.dataset.tip), ev); else hideTip();
});

// ---- keys: space plays, the arrows step a second (shift: ten), Home / End
// jump, up / down pick the next bot, Esc lets go, F follows on a zoomed map,
// 1 / 2 the views
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const step = e.shiftKey ? 10 : 1;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight' && replaying()) { e.preventDefault(); seek(S.t + step); }
  else if (e.key === 'ArrowLeft' && replaying()) { e.preventDefault(); seek(S.t - step); }
  else if (e.key === 'Home' && replaying()) seek(0);
  else if (e.key === 'End' && replaying()) seek(S.cur.len);
  else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && S.c) {
    e.preventDefault();
    const ids = S.c.order.flatMap((team) => S.c.bots.filter((b) => b.team === team).sort((a, b) => a.id - b.id).map((b) => b.id));
    const i = ids.indexOf(S.sel), n = ids.length;
    if (n) select(ids[i < 0 ? (e.key === 'ArrowDown' ? 0 : n - 1) : (i + (e.key === 'ArrowDown' ? 1 : n - 1)) % n]);
  }
  else if (e.key === 'Escape') select(-1);
  else if ((e.key === 'f' || e.key === 'F') && S.sel >= 0) {
    S.follow = !S.follow;
    if (S.follow && !S.mview) S.mview = { x0: 0, y0: 0, span: (S.world || WORLD_PX) / 4 };
    render();
  }
  else if (e.key === 'h' || e.key === 'H') heatToggle();
  else if (e.key === '1') view('match');
  else if (e.key === '2') view('compare');
});
new ResizeObserver(() => render()).observe($('match'));
render();
</script>
